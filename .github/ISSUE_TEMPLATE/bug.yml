name: Bug Report
description: Something isn't working
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash/data loss)
        - Major (feature broken)
        - Minor (cosmetic/edge case)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to...
        2. Tap on...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / OS
      placeholder: "iPhone 15 Pro, iOS 18.2"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
